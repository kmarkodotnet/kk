#
# Verziókatalógus – Kyokushin Karate Trainer
#
# Minden verziószám KIZÁRÓLAG itt szerepel. A modulok `build.gradle.kts` fájljai
# inline verziót nem tartalmazhatnak (lásd .claude/skills/kyo-android-module).
#
# A verziók a 2026-11-11-i tényleges ellenőrzésből származnak:
#   - telepített Android SDK:  platforms/android-36, build-tools/36.1.0, platform-tools 37.0.1
#   - telepített JDK:          Temurin 17.0.21
#   - Gradle:                  services.gradle.org/versions/current -> 9.9.1
#   - AGP, Kotlin, Room, Hilt, Compose BOM, KSP, navigation, lifecycle, serialization,
#     coroutines: a hivatalos Maven metadata legfrissebb STABIL kiadása
#     (alpha/beta/rc kizárva). Részletek: docs/adr/ADR-008-version-matrix.md
#
# Verziószámot kitalálni tilos. Emelés előtt a metadata újraellenőrzendő.
#

[versions]
# --- build toolchain ---
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
# --- Android SDK szintek (lásd ADR-009) ---
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
buildTools = "37.0.0"
# --- AndroidX / Compose ---
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
# --- adat ---
room = "2.8.5"
serialization = "1.12.0"
# --- DI ---
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
# --- aszinkron ---
coroutines = "1.11.0"
# --- teszt ---
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
espresso = "3.7.0"
truth = "1.4.5"
robolectric = "4.17"
# --- minőség (T-607) ---
# A ktlint-gradle 14.2.0 (plugins.gradle.org) a legfrissebb stabil kiadás. A belső
# ktlint motor verzióját NEM írjuk felül: a plugin ehhez a kiadáshoz tesztelt,
# alapértelmezett ktlint-verziója 1.5.0 (lásd a plugin forrása,
# `KtlintExtension.version` property default-ja) – ez a dokumentáltan egymással
# kompatibilis pár, nem kitalált szám.
ktlintGradle = "14.2.0"

[libraries]
# --- Compose (verzió a BOM-ból) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- AndroidX alap ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Room ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# --- szerializáció / coroutines ---
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# A Hilt teszttámogatása ugyanabból a kiadásból, mint a `hilt-android` (2.60.1): a
# `HiltTestApplication` ezzel építi fel a teljes gráfot Robolectric alatt, emulátor nélkül
# (T-203). Nem új verzió, ugyanaz a `hilt` version.ref.
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# --- teszt ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
